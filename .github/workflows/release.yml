name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -ldflags "-s -w -X main.Version=$VERSION" \
            -o colettedn-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/colettedn/

      - name: Checksum
        run: sha256sum colettedn-${{ matrix.goos }}-${{ matrix.goarch }} >> checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: colettedn-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            colettedn-${{ matrix.goos }}-${{ matrix.goarch }}
            checksums.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Merge checksums
        run: cat */checksums.txt | sort > checksums-sha256.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            */colettedn-*
            checksums-sha256.txt
