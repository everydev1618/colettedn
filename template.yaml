AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Colette DN - AI-powered domain name brainstorming

Globals:
  Function:
    Timeout: 60
    MemorySize: 256

Parameters:
  DomainName:
    Type: String
    Default: colettedn.com
    Description: Custom domain name for the API
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key for domain generation
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key for billing
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret
  StripePriceId:
    Type: String
    Description: Stripe price ID for annual subscription

Resources:
  ColetteDNFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ColetteDNFunction
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Timeout: 120  # 2 minutes for Function URL calls
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          APP_URL: !Sub "https://${DomainName}"
          FROM_EMAIL: !Sub "noreply@${DomainName}"
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          STRIPE_PRICE_ID: !Ref StripePriceId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FavoritesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalyticsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OwnedTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MonitoringTable
        - SSMParameterReadPolicy:
            ParameterName: colettedn/*
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: !Sub "noreply@${DomainName}"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  # Notifier Lambda - sends expiration notifications daily
  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: NotifierFunction
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Timeout: 300  # 5 minutes for processing all monitored domains
      MemorySize: 256
      Environment:
        Variables:
          APP_URL: !Sub "https://${DomainName}"
          FROM_EMAIL: !Sub "noreply@${DomainName}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MonitoringTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: !Sub "noreply@${DomainName}"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 14 * * ? *)  # Daily at 2 PM UTC (9 AM EST, 6 AM PST)
            Description: Daily domain expiration notification check
            Enabled: true

  # DynamoDB table for caching
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: domain
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Users table for authentication
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: stripe_customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: stripe-customer-index
          KeySchema:
            - AttributeName: stripe_customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Auth tokens table (magic links and sessions)
  TokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-tokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Favorites table
  FavoritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-favorites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: domain
          KeyType: RANGE

  # Search history table
  HistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: searched_at
          AttributeType: N
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: searched_at
          KeyType: RANGE

  # Owned domains table (tracks user domain acquisitions)
  OwnedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-owned
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: domain
          KeyType: RANGE

  # Monitoring table (tracks domains users are monitoring for expiration)
  MonitoringTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-monitoring
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: domain
          KeyType: RANGE

  # Analytics table for tracking metrics
  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-analytics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # SSL Certificate
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  # Custom Domain for API Gateway
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    DependsOn: Certificate
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          CertificateArn: !Ref Certificate

  # Map the API to the custom domain
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: ApiDomainName
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref DomainName
      Stage: !Ref ServerlessHttpApiApiGatewayDefaultStage

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  FunctionUrl:
    Description: Lambda Function URL (no timeout limit)
    Value: !GetAtt ColetteDNFunctionUrl.FunctionUrl
  CustomDomainUrl:
    Description: Custom domain URL
    Value: !Sub "https://${DomainName}/"
  ApiGatewayDomainTarget:
    Description: CNAME target for Cloudflare DNS
    Value: !GetAtt ApiDomainName.RegionalDomainName
