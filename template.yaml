AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Colette DN - AI-powered domain name brainstorming

Globals:
  Function:
    Timeout: 60
    MemorySize: 256

Parameters:
  DomainName:
    Type: String
    Default: colettedn.com
    Description: Custom domain name for the API
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key for domain generation
  NamecheapApiUser:
    Type: String
    Description: Namecheap API username
  NamecheapApiKey:
    Type: String
    NoEcho: true
    Description: Namecheap API key
  NamecheapUsername:
    Type: String
    Description: Namecheap account username
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key for billing
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret
  StripePriceId:
    Type: String
    Description: Stripe price ID for annual subscription

Resources:
  # VPC for Lambda with static outbound IP
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: colettedn-vpc

  # Internet Gateway for public subnet
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: colettedn-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public subnet (for NAT Gateway)
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: colettedn-public

  # Private subnet (for Lambda)
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: colettedn-private

  # Elastic IP for NAT Gateway (THIS IS THE STATIC IP TO WHITELIST)
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: colettedn-nat-eip

  # NAT Gateway in public subnet
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: colettedn-nat

  # Route table for public subnet (routes to Internet Gateway)
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: colettedn-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Route table for private subnet (routes to NAT Gateway)
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: colettedn-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # Security group for Lambda
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ColetteDN Lambda
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: colettedn-lambda-sg

  # VPC Endpoint for DynamoDB (free, avoids NAT Gateway for DynamoDB calls)
  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  ColetteDNFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ColetteDNFunction
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Timeout: 120  # 2 minutes for Function URL calls
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          NAMECHEAP_API_USER: !Ref NamecheapApiUser
          NAMECHEAP_API_KEY: !Ref NamecheapApiKey
          NAMECHEAP_USERNAME: !Ref NamecheapUsername
          NAMECHEAP_CLIENT_IP: !GetAtt NatEIP.PublicIp
          NAMECHEAP_SANDBOX: "false"
          APP_URL: !Sub "https://${DomainName}"
          FROM_EMAIL: !Sub "noreply@${DomainName}"
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          STRIPE_PRICE_ID: !Ref StripePriceId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TokensTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FavoritesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalyticsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OwnedTable
        - VPCAccessPolicy: {}
        - SSMParameterReadPolicy:
            ParameterName: colettedn/*
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: !Sub "noreply@${DomainName}"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
  # DynamoDB table for caching (replaces SQLite)
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: domain
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Users table for authentication
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: stripe_customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: stripe-customer-index
          KeySchema:
            - AttributeName: stripe_customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Auth tokens table (magic links and sessions)
  TokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-tokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Favorites table
  FavoritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-favorites
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: domain
          KeyType: RANGE

  # Search history table
  HistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: searched_at
          AttributeType: N
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: searched_at
          KeyType: RANGE

  # Owned domains table (tracks user domain acquisitions)
  OwnedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-owned
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: domain
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: domain
          KeyType: RANGE

  # Analytics table for tracking metrics
  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: colettedn-analytics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # SSL Certificate
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS

  # Custom Domain for API Gateway
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    DependsOn: Certificate
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          CertificateArn: !Ref Certificate

  # Map the API to the custom domain
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: ApiDomainName
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref DomainName
      Stage: !Ref ServerlessHttpApiApiGatewayDefaultStage

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  FunctionUrl:
    Description: Lambda Function URL (no timeout limit)
    Value: !GetAtt ColetteDNFunctionUrl.FunctionUrl
  CustomDomainUrl:
    Description: Custom domain URL
    Value: !Sub "https://${DomainName}/"
  ApiGatewayDomainTarget:
    Description: CNAME target for Cloudflare DNS
    Value: !GetAtt ApiDomainName.RegionalDomainName
  NamecheapWhitelistIP:
    Description: Static IP to whitelist in Namecheap API settings
    Value: !GetAtt NatEIP.PublicIp
