<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colette DN — Domain Name Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="logo">
                    <span class="logo-mark">✦</span>
                    <h1 class="logo-text">Colette</h1>
                </div>
            </header>

            <form id="generate-form" class="form">
                <div class="form-group">
                    <textarea
                        id="description"
                        class="form-textarea"
                        rows="4"
                        placeholder="Describe what you're building..."
                        required
                    ></textarea>
                </div>

                <div class="form-group tld-group">
                    <button type="button" class="tld-toggle active" data-value="traditional">.com .co .net</button>
                    <button type="button" class="tld-toggle" data-value="creative">.io .ai .app .dev</button>
                    <input type="hidden" id="tld-style" value="traditional">
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">
                    <span class="btn-text">Generate</span>
                    <span class="btn-loading" hidden>
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>

            <footer class="sidebar-footer">
                <p>Powered by Claude</p>
            </footer>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="empty-state" class="empty-state">
                <p>Describe your project to discover<br>the perfect domain name</p>
            </div>

            <div id="results" class="results" hidden></div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
